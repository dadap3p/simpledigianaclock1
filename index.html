<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

<svg id="clock" viewBox="0 0 300 300">

<g id="ticks"></g>

<line id="hour" x1="150" y1="150" x2="150" y2="95"/>
<line id="minute" x1="150" y1="150" x2="150" y2="70"/>
<line id="second" x1="150" y1="150" x2="150" y2="55"/>

<circle cx="150" cy="150" r="7"/>

</svg>

<div id="digital"></div>
<div id="day"></div>

</div>

<script src="script.js"></script>

</body>
</html>
